# XcodeGen manifest. The .xcodeproj is generated, never committed — an
# Xcode project file is unreviewable in a pull request and is the single
# most common source of merge conflicts on an iOS team.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open FieldTask.xcodeproj

name: FieldTask
options:
  bundleIdPrefix: com.apexmech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  FieldTask:
    type: application
    platform: iOS
    sources:
      - path: FieldTask
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apexmech.fieldtask
        INFOPLIST_FILE: FieldTask/Resources/Info.plist
        # Secrets come from Config.xcconfig, which is gitignored.
        # Copy Config.example.xcconfig to Config.xcconfig to get started.
    configFiles:
      Debug: FieldTask/Resources/Config.xcconfig
      Release: FieldTask/Resources/Config.xcconfig
