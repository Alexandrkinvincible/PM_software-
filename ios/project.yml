# XcodeGen manifest. The .xcodeproj is generated, never committed — an
# Xcode project file is unreviewable in a pull request and is the single
# most common source of merge conflicts on an iOS team.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open PMController.xcodeproj

name: PMController
options:
  bundleIdPrefix: com.pmcontroller
  deploymentTarget:
    # A deployment target is a MINIMUM, not a maximum: 16.0 runs on 16,
    # 18, 26 and everything after. 16 is the oldest floor that costs
    # almost nothing — see docs/DECISIONS.md A5.
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  PMController:
    type: application
    platform: iOS
    sources:
      - path: PMController
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pmcontroller.app
        # 1 = iPhone, 2 = iPad. One binary, two layouts, chosen by size
        # class at runtime. Tablet is the design target; phone follows.
        TARGETED_DEVICE_FAMILY: "1,2"
        # No paid Apple Developer Program needed to build or to run in a
        # Simulator. Signing is left automatic and is only exercised when
        # installing on a physical device.
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: PMController/Resources/Info.plist
        # Secrets come from Config.xcconfig, which is gitignored.
        # Copy Config.example.xcconfig to Config.xcconfig to get started.
    configFiles:
      Debug: PMController/Resources/Config.xcconfig
      Release: PMController/Resources/Config.xcconfig
